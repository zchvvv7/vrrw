input:
  source_type: "video"
  video_path: "data/raw/demo.mp4"
  camera_id: 0
  width: 1280
  height: 720
  fps: 30
  frame_skip: 1

output:
  video_path: "outputs/visualization/demo_result.mp4"
  json_path: "outputs/results/demo_result.json"
  log_path: "outputs/logs/run.log"

road_segmenter:
  config_path: "configs/road_segmenter.yaml"

known_detector:
  model_name: "checkpoints/yolo_best.pt"
  weights_sha256: "1586fa1fa233f664c5a52d60d6617da654e980231a2cfb3eb34f434f3202842f"
  conf_threshold: 0.25
  iou_threshold: 0.45
  device: "auto"
  classes:
    - cone
    - barrier
    - pothole
    - vehicle

distance_estimator:
  enabled: false
  method: "not_implemented"
  model_version: "unimplemented"

corridor_predictor:
  enabled: true
  method: "road_mask_geometry"
  model_version: "v1.0"
  min_road_width: 50
  max_centerline_points: 200
  temporal_window: 5
  confidence_decay: 0.9
  boundary_sample_step: 2
  min_valid_rows: 10
  smoothing_kernel: 5
  obstacle_edge_threshold: 50
  obstacle_min_area_ratio: 0.001
  obstacle_risk_weight: 0.5
  direction_risk_weight: 0.3
  width_risk_weight: 0.2

unknown_detector:
  backend: "mask2anomaly"

  model:
    config_path: "configs/mask2anomaly/anomaly_inference.yaml"
    weights_path: "checkpoints/mask2anomaly/best_contrastive.pth"
    weights_sha256: "4fc7ef19a58e7fd5b41863467d3eee3d36cee3e9a8e839a1cad93cdc0c1e3695"
    device: "cuda:0"
    num_inlier_classes: 19

  post_processing:
    pixel_threshold: 0.5
    known_mask_threshold: 0.5
    known_box_padding_ratio: 0.1
    known_box_min_padding: 4
    min_area_ratio: 0.0002
    max_area_ratio: 0.15
    lower_roi_ratio: 0.25
    roi_dilate_kernel_size: 31
    morphology_kernel_size: 5
    region_score_quantile: 0.95

  inference:
    enable_flip_tta: false

system:
  show_window: false
