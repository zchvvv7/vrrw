input:
  source_type: "video"
  video_path: "data/raw/demo.mp4"
  camera_id: 0
  width: 1280
  height: 720
  fps: 30
  frame_skip: 1

output:
  video_path: "outputs/visualization/demo_result.mp4"
  json_path: "outputs/results/demo_result.json"
  log_path: "outputs/logs/run.log"

road_segmenter:
  config_path: "configs/road_segmenter.yaml"

unknown_detector:
  min_area: 600
  max_area: 40000
  close_kernel_size: 35
  edge_margin_kernel_size: 31
  min_score: 0.35
  lower_roi_ratio: 0.35

system:
  show_window: false